name: dbt CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  dbt_test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Create an empty database from the raw schema
        run: python -c "import duckdb, pathlib; duckdb.connect('nba_clutch.duckdb').execute(pathlib.Path('nba_schema.sql').read_text())"

      - name: Install dbt packages
        working-directory: dbt
        run: dbt deps --profiles-dir .

      - name: Build every model with zero rows
        working-directory: dbt
        run: dbt run --empty --profiles-dir .

      - name: Run dbt tests
        working-directory: dbt
        run: dbt test --profiles-dir . --exclude test_name:equal_rowcount