version: 2

sources:
  - name: raw
    description: "Tables containing raw data stats from the nba_api"
    schema: main
    tables:
      - name: players
      - name: teams
      - name: player_advanced_stats
      - name: player_basic_stats
      - name: clutch_advanced_stats
      - name: home_clutch_stats
      - name: road_clutch_stats
      - name: primary_defenders_stats
      - name: player_awards
      - name: clutch_shots
        columns:
          - name: shot_id
            data_tests:
              - unique
              - not_null
      - name: team_def_ratings