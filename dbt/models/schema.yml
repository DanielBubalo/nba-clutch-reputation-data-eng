version: 2

models:
  - name: player_tier
    description: "Reputation tier for each player-season (Role, Star, or Olympic Gold Medalist), based only on awards won before that season, so later awards can't label earlier seasons."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - player_id
              - season
    columns:
      - name: player_id
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null
      - name: group_tier
        data_tests:
          - accepted_values:
              arguments:
                values: ['Role', 'Star', 'Olympic Gold Medalist']
  - name: player_clutch_performance
    description: "One row per player-season. Combines full-season advanced and basic stats with clutch stats (NBA clutch definition: last 5 minutes of the 4th quarter or overtime, score within 5 points). Only includes player-seasons with more than 100 season field goal attempts and at least 15 clutch games. There is no minimum on clutch shot attempts, so some rows rest on very few clutch shots (check fga_clutch). Columns ending in _clutch are clutch values and _season are full-season values. ts_delta and usg_delta are clutch minus season, so negative means lower in the clutch."
    columns:
      - name: ts_delta
        description: "Clutch true shooting percentage minus season true shooting percentage. Positive means the player shoots better in the clutch than their season average."
      - name: usg_delta
        description: "Clutch usage percentage minus season usage percentage."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - player_id
              - season
  - name: home_vs_road
    description: "One row per player-season, comparing clutch performance at home versus on the road, limited to players with at least 8 clutch games in each setting. ts_home_road_gap is home minus road true shooting, so positive means better at home."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - player_id
              - season
  - name: matchup_analysis
    description: "One row per offensive player, defender, and season. player_id is the offensive player and defensive_player_id is a defender who guarded them. Only includes offensive players who appear in player_clutch_performance. defender_defensive_rating is the defender's own full-season defensive rating. ts_delta and group_tier belong to the offensive player, copied from player_clutch_performance. matchup_minutes is stored as text, so cast it to a number before sorting or comparing."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - player_id
              - season
              - defensive_player_id
  - name: star_player_performance
    description: "One row per player-season. The rows of player_clutch_performance where group_tier is Star or Olympic Gold Medalist, with the same columns plus first_award_season, the player's first award-winning season."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
             - player_id
             - season
  - name: player_clutch_playmaking
    description: "One row per player-season. All rows and columns of player_clutch_performance plus assist_pct_season and rebound_pct_season, for comparing clutch and full-season playmaking."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - player_id
              - season
  - name: shots_with_opponent
    description: "One row per clutch shot attempt (NBA clutch definition), only for player-seasons in player_clutch_performance. shot_made_flag is 1 for a make and 0 for a miss. opponent_team_id is the team the shooter played against, and defensive_rating is that opponent team's full-season defensive rating. ts_delta and group_tier are the shooter's player-season values from player_clutch_performance, repeated on every shot."
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_clutch_shots')
    columns:
      - name: shot_id
        data_tests:
          - unique
          - not_null
  - name: team_abv_lookup
    description: "Maps every team abbreviation used in any season (including historical ones) to its franchise team_id."
    columns:
      - name: team_abv
        data_tests:
          - unique
          - not_null
  - name: stg_players
    description: "Staging model for the raw players table: renames id to player_id and full_name to player_name."
    columns:
      - name: player_id
        data_tests:
          - unique
          - not_null
  - name: stg_teams
    description: "Staging model for the raw teams table: renames id to team_id, abbreviation to team_abv, and full_name to team_name."
    columns:
      - name: team_id
        data_tests:
          - unique
          - not_null
  - name: stg_player_advanced_stats
    description: "Staging model for the raw player_advanced_stats table: renames raw uppercase API field names to their friendly lowercase equivalents."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - player_id
              - season
  - name: stg_player_basic_stats
    description: "Staging model for the raw player_basic_stats table: renames raw uppercase API field names to their friendly lowercase equivalents."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - player_id
              - season
  - name: stg_clutch_advanced_stats
    description: "Staging model for the raw clutch_advanced_stats table: renames raw uppercase API field names to their friendly lowercase equivalents."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - player_id
              - season
  - name: stg_home_clutch_stats
    description: "Staging model for the raw home_clutch_stats table: renames raw uppercase API field names to their friendly lowercase equivalents."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - player_id
              - season
  - name: stg_road_clutch_stats
    description: "Staging model for the raw road_clutch_stats table: renames raw uppercase API field names to their friendly lowercase equivalents."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - player_id
              - season
  - name: stg_primary_defenders_stats
    description: "Staging model for the raw primary_defenders_stats table: renames OFF_PLAYER_ID/OFF_PLAYER_NAME to player_id/player_name and DEF_PLAYER_ID/DEF_PLAYER_NAME to defensive_player_id/defensive_player_name."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - player_id
              - season
              - defensive_player_id
  - name: stg_player_awards
    description: "Staging model for the raw player_awards table: renames PERSON_ID to player_id and DESCRIPTION to award."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - player_id
              - season
              - award
  - name: stg_clutch_shots
    description: "Staging model for the raw clutch_shots table: renames raw uppercase API field names to their friendly lowercase equivalents; shot_id passes through unchanged."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - game_id
              - game_event_id
    columns:
      - name: shot_id
        data_tests:
          - unique
          - not_null
  - name: stg_team_def_ratings
    description: "Staging model for the raw team_def_ratings table: renames raw uppercase API field names to their friendly lowercase equivalents."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - team_id
              - season